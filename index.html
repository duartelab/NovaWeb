<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>PAUTA | Entrar</title>
    
</head>
<body>
    
    <p>CAMPO SERENO - AGENDA PESSOAL</p>
    <h1>Acesse sua agenda</h1>
    <form action="#" method="get">
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Digite o seu email" required>
        
        </div>
        <div>
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
         
        </div>
        <div>
            <input type="checkbox" id="lembrar">
            <label for="lembrar">Lembrar-me</label>
          
        </div>
        <p hidden>Erro - Email ou senha incorreto</p>
        
        <button type="submit">Entrar</button>
    </form>
    <p>Forma de preenchimento: nome@camposereno.com.br Senha:alfanumérico,case sensitive e caracteres especiais</p>


    <script src="./js/app.js"></script>
</body>
</html>
